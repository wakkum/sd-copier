name: Test build (no release)

# Builds the app from a branch or commit and keeps it as a download on the
# workflow run - nothing else. It never creates, edits or uploads to a
# release, so the self-updater (which only reads releases) cannot offer it
# to anyone. For trying a change on a real machine before tagging it.
#
# Actions tab > "Test build (no release)" > Run workflow. When it finishes,
# the zip is under "Artifacts" at the bottom of the run's page.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build"
        required: true
        default: main
        type: string
      platforms:
        description: "Which builds to produce"
        required: true
        default: windows
        type: choice
        options: [windows, mac, both]

# Read-only on purpose: this workflow has no business writing anything.
permissions:
  contents: read

jobs:
  windows:
    if: inputs.platforms == 'windows' || inputs.platforms == 'both'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the app
        shell: cmd
        run: build_windows.bat

      # Named after the commit actually built (not GITHUB_SHA, which is where
      # the workflow was started from), never a version, so a test build is
      # not mistaken for a release.
      - name: Package
        shell: pwsh
        run: |
          $name = "SD-Video-Backup-test-$(git rev-parse --short=7 HEAD)-windows"
          Compress-Archive -Path "dist/SD Video Backup" -DestinationPath "$name.zip"
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 30

  mac:
    if: inputs.platforms == 'mac' || inputs.platforms == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the app
        run: ./build_mac.sh

      - name: Package
        run: |
          NAME="SD-Video-Backup-test-$(git rev-parse --short=7 HEAD)-mac"
          (cd dist && zip -qry "../$NAME.zip" "SD Video Backup.app")
          echo "ZIP_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 30
